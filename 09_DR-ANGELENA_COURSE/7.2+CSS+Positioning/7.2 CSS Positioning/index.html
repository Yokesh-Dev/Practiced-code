<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
  .red-circle{
    background-color: red;
    width: 200px;
    height: 200px;
    border-radius: 300px;
    position: relative;
    bottom: 50px;
    left: 280px;
    top: 50px;
    
  }


    .blue-box{
      background-color: blue;
      width: 500px;
      top: 200px;
      position: absolute;
      right: 250px;
      left: 200px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
